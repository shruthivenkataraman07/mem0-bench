[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mem0-bench"
version = "0.1.0"
description = "An extensible benchmarking framework for evaluating long-term memory architectures for AI agents (Mem0 vs conventional RAG vs full-context)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mem0-bench contributors" }]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "numpy>=1.24",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
mem0 = ["mem0ai>=0.1.0"]
openai = ["openai>=1.30"]
dashboard = ["streamlit>=1.33", "pandas>=2.0", "plotly>=5.20"]
chroma = ["chromadb>=0.5"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
mem0-bench = "mem0_bench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires network access and/or paid API credentials",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP007", "UP006", "UP035", "UP045"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
