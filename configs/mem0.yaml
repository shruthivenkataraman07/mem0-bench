# Mem0 backend configuration.
#
# `mem0_config` is passed verbatim to `mem0.Memory.from_config(...)`. Leave
# it empty ({}) to use Mem0's own defaults (OpenAI LLM + embedder, local
# Qdrant vector store); this requires OPENAI_API_KEY to be set. See
# https://docs.mem0.ai for the full set of supported providers.

top_k: 5

mem0_config:
  llm:
    provider: openai
    config:
      model: gpt-4o-mini
      temperature: 0.0
      api_key: "${OPENAI_API_KEY}"
  embedder:
    provider: openai
    config:
      model: text-embedding-3-small
      api_key: "${OPENAI_API_KEY}"
  vector_store:
    provider: qdrant
    config:
      path: ".mem0_bench_qdrant"
      on_disk: true
