# Preset for a latency-focused scale sweep.
# Usage:
#   mem0-bench scale --backends mem0,rag,full-context --turns 10,25,50,100,250,500,1000 --users 5

description: >
  Sweeps history length to find where full-context's latency stops being
  competitive with retrieval-based approaches. Reports p50/p95/p99 for
  retrieval, generation, and end-to-end stages separately.

backends: [mem0, rag, full-context]
turn_sizes: [10, 25, 50, 100, 250, 500, 1000]
users: 5
seed: 42
